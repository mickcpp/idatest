name: Build APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          log_file="$RUNNER_TEMP/gradle-build.log"
          for attempt in 1 2 3; do
            set +e
            ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$log_file"
            build_status=${PIPESTATUS[0]}
            set -e

            if [[ "$build_status" -eq 0 ]]; then
              exit 0
            fi
            if ! grep -Eiq 'HTTP.*429|status code 429|Too Many Requests' "$log_file"; then
              exit "$build_status"
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit "$build_status"
            fi

            delay=$((attempt * 20))
            echo "Maven returned HTTP 429; retrying the Gradle build in ${delay}s (attempt $((attempt + 1))/3)."
            sleep "$delay"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: WaSchedule-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
